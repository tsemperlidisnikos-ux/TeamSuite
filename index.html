<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <link id="app-favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f2744" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TeamSuite" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeamSuite — Διαχείριση</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        if (location.pathname.indexOf('/app/parent') === 0) {
          var parentManifest = document.querySelector('link[rel="manifest"]');
          if (parentManifest) parentManifest.setAttribute('href', '/manifest-parent.webmanifest');
          document.title = 'TeamSuite Γονείς';
          var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (appleTitle) appleTitle.setAttribute('content', 'TeamSuite Γονείς');
        }
      } catch (e) {}
      try {
        var raw = localStorage.getItem('teamsuite-platform-config-v1');
        var theme = 'navy-amber';
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && parsed.appearanceTheme === 'classic') theme = 'classic';
          else if (parsed && parsed.appearanceTheme === 'navy-amber') theme = 'navy-amber';
        }
        document.documentElement.setAttribute('data-appearance', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-appearance', 'navy-amber');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
